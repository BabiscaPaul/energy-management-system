services:
  # Traefik - API Gateway / Reverse Proxy
  traefik:
    image: traefik:v2.10
    container_name: ems-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"       # HTTP entry point
      - "8080:8080"   # Traefik dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - ems-network

  # PostgreSQL Databases
  postgres-auth:
    image: postgres:15-alpine
    container_name: ems-postgres-auth
    environment:
      POSTGRES_DB: credential_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - ems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d credential_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-user:
    image: postgres:15-alpine
    container_name: ems-postgres-user
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks:
      - ems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-device:
    image: postgres:15-alpine
    container_name: ems-postgres-device
    environment:
      POSTGRES_DB: device_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - postgres-device-data:/var/lib/postgresql/data
    networks:
      - ems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d device_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway - Orchestrator
  gateway-service:
    build:
      context: ./backend
      dockerfile: gateway-service/Dockerfile
    container_name: ems-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      USER_SERVICE_URL: http://user-service:8002
      DEVICE_SERVICE_URL: http://device-service:8003
      SECRET_KEY: eenie-meenie-miney-mo-secret-key
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - user-service
      - device-service
    networks:
      - ems-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.services.gateway.loadbalancer.server.port=8000"

  # Auth Service
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: ems-auth-service
    environment:
      DB_USER: admin
      DB_PASSWORD: admin
      DB_HOST: postgres-auth
      DB_PORT: 5432
      CREDENTIAL_DB_NAME: credential_db
      SECRET_KEY: eenie-meenie-miney-mo-secret-key
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - ems-network
    # Not exposed publicly - only accessible via gateway

  # User Service
  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: ems-user-service
    environment:
      DB_USER: admin
      DB_PASSWORD: admin
      DB_HOST: postgres-user
      DB_PORT: 5432
      USER_DB_NAME: user_db
      SECRET_KEY: eenie-meenie-miney-mo-secret-key
    depends_on:
      postgres-user:
        condition: service_healthy
    networks:
      - ems-network
    # Not exposed publicly - only accessible via gateway

  # Device Service
  device-service:
    build:
      context: ./backend
      dockerfile: device-service/Dockerfile
    container_name: ems-device-service
    environment:
      DB_USER: admin
      DB_PASSWORD: admin
      DB_HOST: postgres-device
      DB_PORT: 5432
      DEVICE_DB_NAME: device_db
      SECRET_KEY: eenie-meenie-miney-mo-secret-key
    depends_on:
      postgres-device:
        condition: service_healthy
    networks:
      - ems-network
    # Not exposed publicly - only accessible via gateway

networks:
  ems-network:
    driver: bridge

volumes:
  postgres-auth-data:
  postgres-user-data:
  postgres-device-data:
